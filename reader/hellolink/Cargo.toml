[package]
name = "hellolink"
version = "0.1.0"
edition = "2024"
description = "The reader of HelloLink's live-state strip, format 1 (docs/STRIP.md)"
license = "MIT"
publish = false

[dependencies]
hellolink-format = { path = "../hellolink-format" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
miniz_oxide = "0.9"
serde = "1"
serde_json = "1"
signal-hook = { version = "0.4.6", default-features = false }
