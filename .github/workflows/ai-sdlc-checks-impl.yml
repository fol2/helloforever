# Copy of the AI-SDLC skill's reusable checks workflow (v3). The skill repository belongs to
# another owner and cannot be called from here, so this repository keeps a copy. Do not edit it
# here: replace it with the skill's file when the skill changes. Two things differ: the default
# runner, and a head that no review names yet is `pending` here, not a failure (#84).
#
# AI-SDLC checks: the PR-time controls that back the must-hold rules, for every agent on every CLI.
#
# Reusable workflow. An adopting repo calls it from a thin workflow (templates/workflows/
# ai-sdlc-checks.yml). The checks run the skill's scripts from `.ai-sdlc/` in the adopting repo
# (installed and refreshed by scripts/adopt.sh), because a caller's token cannot read the private
# skill repo. The one implementation is tested in the skill repo (tests/).
#
# Trust. Every script is read from the BASE branch (`git show origin/<base>:<scripts_dir>/<name>`),
# never from the PR checkout, so a PR cannot weaken the gate that checks it: a change to
# `.ai-sdlc/` reaches the base only through a reviewed PR. The scripts never execute PR code; they
# read the PR's diff and comments as data. The caller therefore runs on `pull_request_target`,
# whose workflow definition also comes from the base. A script missing on the base fails the job:
# the adoption PR must merge (by the owner, before the checks are required) before they gate.
#
#   review-on-head       the latest review of the PR's current head is an APPROVE (merge gate)
#   owner-decisions      docs/owner-decisions.md only gains lines
#   locked-tests         on fix/* branches, the committed failing test is unchanged
#   secret-scan          credential-shaped text among the lines the PR adds
#
# review-on-head runs on pull_request_target and on issue_comment (created, edited, deleted),
# because the review lands after the push and can be edited or removed. A run started by a comment
# belongs to the default branch, not to the PR head, so the job writes a commit status
# `ai-sdlc/review-on-head` on the PR's head sha in the same step that computes it, on success and
# on failure alike. Runs for one PR and head are serialised (concurrency group per PR and head), so
# the last run to finish is the last comment's and no run for an older head can displace one for
# the current head. Require that status context in branch protection, not the job; the other three
# jobs are required by name.
#
# Runner. Self-hosted by default, by owner decision (14 Oct 2026): no paid Actions minutes. The
# runner needs git, gh (signed in through GH_TOKEN, as here) and a POSIX sh. Because the checks
# never execute PR code, a self-hosted runner is as safe here as a hosted one.
name: AI-SDLC checks

on:
  workflow_call:
    inputs:
      base:
        description: The base branch
        type: string
        default: main
      scripts_dir:
        description: Where the skill's check scripts live in this repo
        type: string
        default: .ai-sdlc
      test_paths:
        description: Pathspecs that identify test files, space-separated
        type: string
        default: "tests/ :(glob)**/test_*.py :(glob)**/*_test.go :(glob)**/*.test.* :(glob)**/*.spec.*"
      runs_on:
        description: Runner label(s) as a JSON array; the runner holds git, gh and sh
        type: string
        default: '["ubuntu-24.04"]'

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

# The PR's own commits are fetched as data (refs/pull/<n>/head) and never checked out as the
# working tree the scripts run from.

jobs:
  resolve:
    name: Resolve the PR and its head
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      branch: ${{ steps.pr.outputs.branch }}
      is_pr: ${{ steps.pr.outputs.is_pr }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_ISSUE_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          set -eu
          command -v gh >/dev/null || { echo "::error::gh is not installed on this runner"; exit 2; }
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; then
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "head=$PR_HEAD" >> "$GITHUB_OUTPUT"
            echo "branch=$PR_BRANCH" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = issue_comment ] && [ "$IS_ISSUE_PR" = true ]; then
            # gh's own --jq: a self-hosted runner need not have jq. The head is validated before
            # it is published, so an empty or odd answer fails the job instead of writing a status
            # on the wrong ref.
            head=$(gh pr view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
            branch=$(gh pr view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
            case "$head" in *[!0-9a-f]*|"") echo "::error::could not resolve the head of #$ISSUE_NUMBER: '$head'"; exit 2 ;; esac
            [ ${#head} -eq 40 ] || { echo "::error::head of #$ISSUE_NUMBER is not a 40-character sha: '$head'"; exit 2; }
            [ -n "$branch" ] || { echo "::error::could not resolve the head branch of #$ISSUE_NUMBER"; exit 2; }
            echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            echo "head=$head" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
          fi

  review-on-head:
    name: Independent APPROVE names the head
    needs: resolve
    if: needs.resolve.outputs.is_pr == 'true'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # One group per PR and head: a late run for an older head can never replace or cancel a queued
    # run for the current head, and a status is only ever written to the head its group names.
    concurrency:
      group: ai-sdlc-review-on-head-${{ github.repository }}-${{ needs.resolve.outputs.number }}-${{ needs.resolve.outputs.head }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check the latest review of ${{ needs.resolve.outputs.head }} and write its status
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.number }}
          HEAD: ${{ needs.resolve.outputs.head }}
          BASE: ${{ inputs.base }}
          SCRIPTS: ${{ inputs.scripts_dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # GitHub runs `bash -e`, so every failing command is wrapped in if/else: the status POST must
        # run on a failure too, or a revoked approval would leave the last success in place.
        run: |
          set -u
          git fetch -q origin "$BASE"
          if git show "origin/$BASE:$SCRIPTS/review_on_head.sh" > "$RUNNER_TEMP/review_on_head.sh" 2>/dev/null; then
            if sh "$RUNNER_TEMP/review_on_head.sh" "$PR" "$HEAD" --repo "$GITHUB_REPOSITORY" > result.txt 2>&1; then code=0; else code=$?; fi
            cat result.txt
            line=$(head -1 result.txt | cut -c1-140)
          else
            echo "::error::$SCRIPTS/review_on_head.sh is not on $BASE: merge the adoption PR (scripts/adopt.sh) before requiring this check"
            code=2; line="review_on_head.sh missing on $BASE"
          fi
          # Read and publish in one step, inside the per-PR-and-head concurrency group. GitHub keeps
          # the latest status per context.
          case "$code" in 0) state=success ;; 1) state=failure ;; *) state=error ;; esac
          # The review comes after the push: a head that no review names yet is pending, not a
          # failure, so the PR is not red before its review (#84). The status stays short of
          # success, so the gate holds; a REQUEST CHANGES or an unclear verdict still fails.
          if [ "$code" = 1 ] && grep -q '^REVIEW-ON-HEAD FAIL: no review names head ' result.txt; then
            state=pending; code=0
          fi
          if gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" \
               -f state="$state" -f context=ai-sdlc/review-on-head -f target_url="$RUN_URL" \
               -f description="$line" > /dev/null; then
            echo "status ai-sdlc/review-on-head=$state on $HEAD"
          else
            echo "::error::could not write the status ai-sdlc/review-on-head on $HEAD"; [ "$code" -ne 0 ] || code=2
          fi
          exit "$code"

  owner-decisions:
    name: owner-decisions.md is append-only
    needs: resolve
    if: needs.resolve.outputs.is_pr == 'true' && github.event_name != 'issue_comment'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No removed lines in docs/owner-decisions.md
        env:
          BASE: ${{ inputs.base }}
          PR: ${{ needs.resolve.outputs.number }}
          SCRIPTS: ${{ inputs.scripts_dir }}
        run: |
          set -u
          git fetch -q origin "$BASE" "refs/pull/$PR/head:refs/remotes/pr/head"
          if ! git show "origin/$BASE:$SCRIPTS/owner_decisions_check.sh" > "$RUNNER_TEMP/owner_decisions_check.sh" 2>/dev/null; then
            echo "::error::$SCRIPTS/owner_decisions_check.sh is not on $BASE: merge the adoption PR (scripts/adopt.sh) before requiring this check"; exit 2
          fi
          sh "$RUNNER_TEMP/owner_decisions_check.sh" "origin/$BASE" pr/head

  locked-tests:
    name: A fix leaves its failing test alone
    needs: resolve
    if: needs.resolve.outputs.is_pr == 'true' && github.event_name != 'issue_comment'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare test files with the commit that added them
        env:
          BASE: ${{ inputs.base }}
          PR: ${{ needs.resolve.outputs.number }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          TEST_PATHS: ${{ inputs.test_paths }}
        run: |
          set -eu
          case "$BRANCH" in fix/*) ;; *) echo "not a fix/ branch: skipped"; exit 0 ;; esac
          git fetch -q origin "$BASE" "refs/pull/$PR/head:refs/remotes/pr/head"
          HEAD=pr/head
          # shellcheck disable=SC2086
          first=$(git log --reverse --format=%H "origin/$BASE..$HEAD" -- $TEST_PATHS | head -1)
          [ -n "$first" ] || { echo "no test commit on this branch: skipped (the PR must say why)"; exit 0; }
          # shellcheck disable=SC2086
          locked=$(git diff-tree --no-commit-id --name-only -r "$first" -- $TEST_PATHS)
          [ -n "$locked" ] || { echo "no test files in $first: skipped"; exit 0; }
          # shellcheck disable=SC2086
          changed=$(git --literal-pathspecs diff --no-renames --name-status "$first" "$HEAD" -- $locked)
          if [ -n "$changed" ]; then
            echo "::error::LOCKED-TESTS FAIL: the failing test committed in ${first%${first#????????????}} changed afterwards. Fix the code, not the test."
            printf '%s\n' "$changed"; exit 1
          fi
          echo "LOCKED-TESTS OK: $(printf '%s\n' "$locked" | wc -l | tr -d ' ') file(s) unchanged since ${first%${first#????????????}}"

  secret-scan:
    name: No credentials in the PR range
    needs: resolve
    if: needs.resolve.outputs.is_pr == 'true' && github.event_name != 'issue_comment'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan added lines (reports file, line and rule, never the text)
        env:
          BASE: ${{ inputs.base }}
          PR: ${{ needs.resolve.outputs.number }}
          SCRIPTS: ${{ inputs.scripts_dir }}
        run: |
          set -u
          git fetch -q origin "$BASE" "refs/pull/$PR/head:refs/remotes/pr/head"
          if ! git show "origin/$BASE:$SCRIPTS/secret_scan.sh" > "$RUNNER_TEMP/secret_scan.sh" 2>/dev/null; then
            echo "::error::$SCRIPTS/secret_scan.sh is not on $BASE: merge the adoption PR (scripts/adopt.sh) before requiring this check"; exit 2
          fi
          sh "$RUNNER_TEMP/secret_scan.sh" "origin/$BASE" pr/head
