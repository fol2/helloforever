name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and luacheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 lua-check
      - name: Unit tests (fight ids, envelope, freshness, quest states)
        run: lua5.1 tests/id_freshness.lua
      - name: Mock-client harness
        run: lua5.1 tests/fights_harness_v4.lua ./HelloForever "$RUNNER_TEMP/HelloForever_SV.lua" "$RUNNER_TEMP/truth.json"
      - name: AI-SDLC adoption (controls present and wired)
        run: sh .github/ai_sdlc_adoption.sh
      - name: Mock-client harness, with the extra reset sections
        run: lua5.1 tests/fights_harness_more.lua ./HelloForever "$RUNNER_TEMP/HelloForever_SV2.lua" "$RUNNER_TEMP/truth2.json"
      - name: HelloLink spike (a tool's text reaches the addon through a slot)
        run: python3 tools/hellolink.py install "$RUNNER_TEMP/AddOns" --slots 3 && lua5.1 tests/hellolink_test.lua "$RUNNER_TEMP/AddOns"
      - name: HelloLink strip (a text the addon draws decodes from an image)
        run: mkdir -p "$RUNNER_TEMP/strip" && lua5.1 tests/hellolink_strip_test.lua "$RUNNER_TEMP/strip"
      - name: HelloLink strip reader against bad images
        run: python3 tests/hellolink_strip_test.py
      - name: Live-state strip, format 1 (the Python codec against the spec)
        run: python3 tests/strip1_test.py
      - name: Lint
        run: luacheck HelloForever HelloLink tests
      - name: Release checks (versions agree, changelog entry, TOC files exist)
        run: python3 tools/package.py --check --no-tests
