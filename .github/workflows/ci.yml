name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        group: [rust, addon, watch, strip, harness, rest]   # six machines at once (tests/run_all.sh)
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and luacheck
        if: matrix.group != 'rust'
        # The runner's package lists are fresh enough as a rule; update them only when that fails.
        # No man-page index after the install: it took most of the step's 35 to 48 s.
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get install -y -qq --no-install-recommends lua5.1 lua-check \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lua5.1 lua-check; }
      - name: Keep the Rust reader's build between runs
        # one cache a group: `addon` keeps the release build only, `rust` the tests' build too
        if: matrix.group == 'addon' || matrix.group == 'rust'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            reader/target
          key: rust-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('reader/Cargo.lock') }}-${{ hashFiles('reader/**/*.rs') }}
          restore-keys: rust-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('reader/Cargo.lock') }}-
      - name: The group's tests, at once (tests/run_all.sh ${{ matrix.group }})
        run: sh tests/run_all.sh ${{ matrix.group }}
