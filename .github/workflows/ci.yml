name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        group: [rust, addon, harness, rest]   # four machines at once (tests/run_all.sh)
    steps:
      - uses: actions/checkout@v4
      - name: Keep the Lua packages between runs
        # apt took 7 to 40 s a job (its lists, its mirrors); the packages from the cache take a
        # few seconds with dpkg
        if: matrix.group != 'rust'
        id: lua-cache
        uses: actions/cache@v4
        with:
          path: ~/lua-debs
          key: lua-debs-ubuntu-24.04-lua5.1-lua-check-v1
      - name: Install Lua 5.1 and luacheck
        if: matrix.group != 'rust'
        # No man-page index after the install: it took most of the step's time before.
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          if [ "${{ steps.lua-cache.outputs.cache-hit }}" != true ]; then
            mkdir -p ~/lua-debs/partial
            get() { sudo apt-get install -y -qq --download-only --no-install-recommends -o Dir::Cache::archives="$HOME/lua-debs" lua5.1 lua-check; }
            get || { sudo apt-get update -qq && get; }
            sudo rm -rf ~/lua-debs/partial ~/lua-debs/lock
            sudo chown -R "$USER" ~/lua-debs
          fi
          sudo dpkg -i ~/lua-debs/*.deb > /dev/null
          lua5.1 -v && luacheck --version
      - name: Keep the Rust reader's build between runs
        # one cache a group: `addon` keeps the release build only, `rust` the tests' build too
        if: matrix.group == 'addon' || matrix.group == 'rust'
        id: rust-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            reader/target
          # `addon` builds the release only: its key leaves the tests out, so a change to them
          # alone is an exact hit there
          key: rust-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('reader/Cargo.lock') }}-${{ matrix.group == 'rust' && hashFiles('reader/**/*.rs', 'reader/**/Cargo.toml', 'reader/hellolink/tests/**') || hashFiles('reader/**/*.rs', 'reader/**/Cargo.toml', '!reader/hellolink/tests/**') }}
          restore-keys: rust-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('reader/Cargo.lock') }}-
      - name: Date the reader's sources before its cached build (an exact cache hit only)
        # The cache holds a build of these very sources (its key is their hash), but a checkout
        # dates every file now, and cargo rebuilds what is newer than its build. Only on an exact
        # hit: after a partial one the sources differ from the build, and cargo must see them new.
        if: steps.rust-cache.outputs.cache-hit == 'true'
        run: find reader -path reader/target -prune -o -type f -exec touch -t 200001010000 {} +
      - name: The group's tests, at once (tests/run_all.sh ${{ matrix.group }})
        run: sh tests/run_all.sh ${{ matrix.group }}
